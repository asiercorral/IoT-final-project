<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantPulse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 15V7M8 9C8 5 5 3 2 3c0 4 3 6 6 6m0-2c0-3 2-5 6-5 0 4-3 5-6 5' fill='none' stroke='%232e7d32' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">PlantPulse</p>
      <h1 id="plant-name">Plant monitor</h1>
    </div>
    <p class="updated" id="updated" aria-live="polite">Loading…</p>
  </header>

  <main>
    <section class="hero" aria-labelledby="state-label">
      <div class="state" id="state-card" data-state="none">
        <div class="state-head">
          <span class="state-icon" id="state-icon" aria-hidden="true">…</span>
          <div>
            <p class="state-kicker">Plant state</p>
            <h2 id="state-label">Loading…</h2>
          </div>
          <div class="cells" id="cells" aria-hidden="true"></div>
        </div>
        <p class="reason" id="reason"></p>
        <p class="explanation" id="explanation"></p>
        <ul class="findings" id="findings" hidden></ul>
      </div>

      <div class="forecast" aria-labelledby="forecast-title">
        <p class="state-kicker">Weather</p>
        <h2 id="forecast-title">Forecast</h2>
        <p class="forecast-line" id="forecast-source"></p>
        <p id="forecast-why"></p>
      </div>
    </section>

    <section aria-labelledby="readings-title">
      <div class="section-head">
        <h2 id="readings-title">Latest readings</h2>
        <p class="muted" id="readings-age"></p>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section aria-labelledby="history-title">
      <div class="section-head">
        <h2 id="history-title">History</h2>
        <div class="controls">
          <div class="segmented" role="group" aria-label="Period">
            <button type="button" data-hours="24" aria-pressed="true">24 h</button>
            <button type="button" data-hours="168" aria-pressed="false">7 days</button>
          </div>
          <a class="download" id="download" href="/api/history?hours=24&amp;format=csv">Download CSV</a>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="chart" class="chart" role="img" aria-label="Sensor history"></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <p class="muted chart-note" id="chart-note"></p>
    </section>
  </main>

  <footer>
    Data stays on the Raspberry Pi. The page refreshes every minute.
    <a href="/api/status">API</a>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
