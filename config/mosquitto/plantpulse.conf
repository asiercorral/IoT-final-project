# PlantPulse broker settings (T-19).
# Install on the Pi: sudo cp config/mosquitto/plantpulse.conf /etc/mosquitto/conf.d/
#                    sudo systemctl restart mosquitto
#
# Mosquitto 2 listens only on localhost unless a listener is set. This opens
# port 1883 on every network interface so a laptop on the same network can
# subscribe. Debian's /etc/mosquitto/mosquitto.conf already turns on
# persistence, so retained states survive a broker restart.

listener 1883

# No username or password: anyone on the local network can read and publish.
# Accepted for the classroom demo; see "MQTT broker" in the README.
allow_anonymous true
